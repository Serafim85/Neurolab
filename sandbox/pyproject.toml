[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "closed-sandbox"
version = "0.1.0"
description = "Closed-contour sandbox for brain-inspired / SNN projects (Neurolab)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
closed-sandbox = "closed_sandbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "integration: starts local Outpost (sovereignd); slower, needs GGUF + binary",
]
