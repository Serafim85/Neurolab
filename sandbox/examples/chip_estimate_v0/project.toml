[project]
id = "chip-estimate-v0"
name = "Neuro-chip rough estimate (generic neuromorphic)"
version = "0.1.0"
domain = "neuro_chip"

[network]
kind = "neuro_chip"
n_inputs = 16
n_hidden = 64
n_outputs = 2

[chip]
target = "generic_neuromorphic_v0"
# Optional: map activity from a prior snn_lif run (else topology heuristic).
source_metrics = "fixtures/anomaly-v0-metrics.json"

[budget]
max_neurons = 128
max_synapses = 4096
max_spikes_per_sample = 5000
max_chip_power_mw = 50.0
max_chip_area_mm2 = 25.0

[task]
kind = "chip_estimate"
metric_primary = "chip_fit_score"

[economy]
# Generic cost proxy: quality_per_unit_cost = chip_fit_score / chip_power_mw.
# Estimated power, not measured silicon (see chip_estimate_disclaimer).
cost_key = "chip_power_mw"
cost_unit = "mW"

[sandbox]
scenarios = ["nominal", "high_activity", "sparse"]
seed = 42

[contour]
ask_enabled = true
provider = "local"
base_url = "http://127.0.0.1:8090/v1"
model = "outpost-tiny-hammer"
