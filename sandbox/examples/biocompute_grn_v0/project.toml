[project]
id = "biocompute-grn-v0"
name = "Boolean GRN toy (digital biocompute)"
version = "0.1.0"
domain = "biocompute"

[circuit]
kind = "boolean_grn_v0"
n_genes = 12
n_inputs = 4
n_outputs = 2
steps = 12
n_train = 64
n_test = 32

[budget]
max_genes = 32
max_edges = 128
max_steps = 64
max_bio_resource = 50000

[task]
kind = "binary_logic"
metric_primary = "accuracy"

[sandbox]
scenarios = ["balanced", "sparse", "dense"]
seed = 42

[contour]
ask_enabled = true
provider = "local"
base_url = "http://127.0.0.1:8090/v1"
model = "outpost-tiny-hammer"
