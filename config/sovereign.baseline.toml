# Neurolab — baseline daemon for Outpost-Tiny base model (port 8090).
# Paths absolute so cwd does not matter. GGUF not in git.

[server]
host = "127.0.0.1"
port = 8090

[models]
dir = "/Users/valentin/Projects/neurolab/artifacts/base"
active = "tiny-base"
path = "/Users/valentin/Projects/neurolab/artifacts/base/Qwen2.5-3B-Instruct-Q4_K_M.gguf"

[inference]
memory_limit_mb = 6144
threads = 4
context_size = 4096
chat_template = "chatml"
system_prompt = """\
Отвечай на русском, если вопрос на русском. Будь кратким и точным.
Не выдумывай факты о заказчике. Для структурированных задач соблюдай формат ответа.
"""

[audit]
enabled = true
log_path = "/Users/valentin/Projects/neurolab/artifacts/baseline-audit.jsonl"
log_prompt_content = false
